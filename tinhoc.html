<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ôn tập Tin học 12 — Ôn tập 12</title>
<meta name="description" content="Ôn tập trắc nghiệm Tin học 12 — Trí tuệ nhân tạo, Mạng máy tính, Đạo đức số, Thiết kế web HTML, bám sát đề cương cuối kỳ." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💻</text></svg>" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="topbar theme-blue">
  <div class="container row">
    <a class="brand" href="index.html" style="text-decoration:none;color:#fff"><span class="star">★</span> <div>Ôn tập 12<small>💻 Tin học 12 — Trắc nghiệm theo chuyên đề</small></div></a>
    <div style="display:flex;align-items:center;gap:10px">
      <button id="themeToggleBtn" class="theme-toggle" onclick="toggleTheme()" title="Chuyển giao diện sáng/tối">🌙</button>
      <div id="headerRight"></div>
    </div>
  </div>
</header>

<main>
  <div class="container" id="appRoot"></div>
</main>

<footer>Ôn tập 12 · Tin học · Dữ liệu biên soạn từ đề cương ôn tập cuối kỳ 1 · <a href="index.html">← Về trang chọn môn</a></footer>

<script src="js/data_tinhoc.js"></script>
<script src="js/auth.js"></script>
<script>
function renderApp() {
  const root = document.getElementById('appRoot');
  renderHeaderRight();
  if (!requireAuthOrRedirect()) return;
  const user = currentUser();

  const totalQuestions = QUIZ_DATA_TINHOC.reduce((s, l) => s + l.questions.length, 0);
  const stats = subjectStats(user, 'tinhoc', QUIZ_DATA_TINHOC.length);

  root.innerHTML = `
    <div style="margin-bottom:16px">
      <a href="index.html" class="btn btn-ghost">← Chọn môn khác</a>
    </div>

    <div class="card hero tinhoc">
      <div class="hero-top">
        <a href="profile.html" style="text-decoration:none;color:inherit">${avatarHtml(user, 56)}</a>
        <div>
          <h1>💻 Ôn tập Tin học 12</h1>
          <p>Chọn một chuyên đề bên dưới để luyện trắc nghiệm. Gồm câu hỏi 1 đáp án đúng và câu hỏi Đúng/Sai nhiều ý.</p>
        </div>
      </div>
      <div class="stats-row">
        <div class="stat"><b>${QUIZ_DATA_TINHOC.length}</b><span>Chuyên đề</span></div>
        <div class="stat"><b>${totalQuestions}</b><span>Câu hỏi</span></div>
        <div class="stat"><b>${stats.done}</b><span>Chuyên đề đã luyện</span></div>
        <div class="stat"><b>${stats.avgPct}%</b><span>Điểm trung bình</span></div>
      </div>
      <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn btn-primary tinhoc" href="quiz.html?subject=tinhoc&lesson=all">🎯 Ôn tập tổng hợp (tất cả ${totalQuestions} câu)</a>
        <a class="btn btn-ghost" href="quiz.html?subject=tinhoc&lesson=random40">🎲 Trộn ngẫu nhiên 40 câu</a>
        <a class="btn btn-ghost" href="profile.html">🪪 Hồ sơ của tôi</a>
      </div>
    </div>

    ${LESSON_GROUPS_TINHOC.map(group => {
      const lessons = QUIZ_DATA_TINHOC.filter(l => group.lessons.includes(l.num));
      if (!lessons.length) return '';
      return `
      <div class="section-title tinhoc"><h2>${group.title}</h2><span>${lessons.length} chuyên đề</span></div>
      <div class="lesson-grid">
        ${lessons.map(l => {
          const p = subjectLessonProgress(user, 'tinhoc', l.num);
          const pct = p ? Math.round((p.bestScore / p.total) * 100) : null;
          return `
          <div class="lesson-card tinhoc">
            <div class="num">CHUYÊN ĐỀ ${l.num}</div>
            <h3>${l.title}</h3>
            <div class="progress-bar"><i style="width:${pct ?? 0}%"></i></div>
            <div class="meta">
              <span>${l.questions.length} câu hỏi</span>
              <span>${pct !== null ? pct + '% điểm tốt nhất' : 'Chưa làm'}</span>
            </div>
            <a class="btn btn-primary btn-block tinhoc" href="quiz.html?subject=tinhoc&lesson=${l.num}">Bắt đầu luyện tập</a>
          </div>`;
        }).join('')}
      </div>`;
    }).join('')}
  `;
}

renderApp();
</script>
</body>
</html>
