<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OnLuyenHVN</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #0f172a;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
header {
  padding: 70px 15px;
  background: linear-gradient(135deg,#2563eb,#9333ea);
}
h1 { font-size: 38px; }
main { padding: 35px 15px; }
.card {
  background: #1e293b;
  padding: 25px;
  margin: 15px auto;
  max-width: 450px;
  border-radius: 15px;
}
button {
  background: #38bdf8;
  border: 0;
  padding: 13px 25px;
  border-radius: 10px;
}
</style>
</head>
<body>
<header>
  <h1>OnLuyenHVN</h1>
  <p>Học tập và ôn luyện mỗi ngày!</p>
</header>
<main>
  <div class="card">
    <h2>Chào mừng bạn!</h2>
    <p>Website ôn luyện kiến thức trực tuyến.</p>
    <button onclick="alert('Chào mừng đến với OnLuyenHVN!')">
      Bắt đầu
    </button>
  </div>
</main>
</body>
</html>
