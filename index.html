<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trắc nghiệm Lịch sử 12 — Ôn tập theo bài</title>
<meta name="description" content="Ôn tập trắc nghiệm Lịch sử 12 theo từng bài học (Bài 1 - 17), chuyển thể từ bộ câu hỏi trả lời ngắn." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.3.3/dist/email.min.js"></script>
</head>
<body>

<header class="topbar">
  <div class="container row">
    <div class="brand"><span class="star">★</span> <div>Ôn thi Lịch sử 12<small>Trắc nghiệm theo từng bài học</small></div></div>
    <div id="headerRight"></div>
  </div>
</header>

<main>
  <div class="container" id="appRoot"></div>
</main>

<footer>Trắc nghiệm Lịch sử 12 · Dữ liệu biên soạn từ bộ câu hỏi trả lời ngắn Bài 1–17 · Chạy hoàn toàn trên trình duyệt (GitHub Pages)</footer>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script>
function renderHeaderRight() {
  const user = currentUser();
  const el = document.getElementById('headerRight');
  if (user) {
    el.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px">
        <div class="user-chip">
          <div class="avatar">${user.fullname ? user.fullname[0].toUpperCase() : user.username[0].toUpperCase()}</div>
          <span>${user.fullname || user.username}</span>
        </div>
        <button class="btn btn-outline" onclick="logoutUser()">Đăng xuất</button>
      </div>`;
  } else {
    el.innerHTML = '';
  }
}

function lessonProgress(user, lessonNum) {
  if (!user || !user.progress) return null;
  return user.progress[String(lessonNum)] || null;
}

function renderApp() {
  const root = document.getElementById('appRoot');
  const user = currentUser();
  renderHeaderRight();

  if (!user) {
    root.innerHTML = renderAuthScreen();
    bindAuthEvents();
    return;
  }

  const totalQuestions = QUIZ_DATA.reduce((s, l) => s + l.questions.length, 0);
  let doneLessons = 0, totalPct = 0;
  QUIZ_DATA.forEach(l => {
    const p = lessonProgress(user, l.num);
    if (p) { doneLessons++; totalPct += p.bestScore / p.total; }
  });
  const avgPct = doneLessons ? Math.round((totalPct / doneLessons) * 100) : 0;

  root.innerHTML = `
    <div class="card hero">
      <h1>Chào ${user.fullname || user.username} 👋</h1>
      <p>Chọn một bài học bên dưới để bắt đầu luyện trắc nghiệm. Mỗi bài có đúng số câu như trong tài liệu gốc.</p>
      <div class="stats-row">
        <div class="stat"><b>${QUIZ_DATA.length}</b><span>Bài học</span></div>
        <div class="stat"><b>${totalQuestions}</b><span>Câu hỏi</span></div>
        <div class="stat"><b>${doneLessons}</b><span>Bài đã luyện</span></div>
        <div class="stat"><b>${avgPct}%</b><span>Điểm trung bình</span></div>
      </div>
      <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn btn-primary" href="quiz.html?lesson=all">🎯 Ôn tập tổng hợp (tất cả ${totalQuestions} câu)</a>
        <a class="btn btn-ghost" href="quiz.html?lesson=random40">🎲 Trộn ngẫu nhiên 40 câu</a>
      </div>
    </div>

    <div class="section-title"><h2>Danh sách bài học</h2><span>${QUIZ_DATA.length} bài — Bài 1 đến Bài 17</span></div>
    <div class="lesson-grid">
      ${QUIZ_DATA.map(l => {
        const p = lessonProgress(user, l.num);
        const pct = p ? Math.round((p.bestScore / p.total) * 100) : null;
        return `
        <div class="lesson-card">
          <div class="num">BÀI ${l.num}</div>
          <h3>${l.title}</h3>
          <div class="progress-bar"><i style="width:${pct ?? 0}%"></i></div>
          <div class="meta">
            <span>${l.questions.length} câu hỏi</span>
            <span>${pct !== null ? pct + '% điểm tốt nhất' : 'Chưa làm'}</span>
          </div>
          <a class="btn btn-primary btn-block" href="quiz.html?lesson=${l.num}">Bắt đầu luyện tập</a>
        </div>`;
      }).join('')}
    </div>
  `;
}

function renderAuthScreen() {
  return `
  <div class="auth-wrap">
    <div class="card auth-card">
      <div class="logo-center">
        <div class="star">★</div>
        <h1>Trắc nghiệm Lịch sử 12</h1>
        <p>Đăng nhập hoặc tạo tài khoản để bắt đầu ôn tập</p>
      </div>
      <div class="auth-tabs">
        <button id="tabLogin" class="active" onclick="switchTab('login')">Đăng nhập</button>
        <button id="tabRegister" onclick="switchTab('register')">Đăng ký</button>
      </div>

      <div id="formMsg" class="form-msg"></div>

      <form id="loginForm">
        <div class="field">
          <label>Tên đăng nhập</label>
          <input type="text" id="loginUsername" autocomplete="username" required />
        </div>
        <div class="field">
          <label>Mật khẩu</label>
          <input type="password" id="loginPassword" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Đăng nhập</button>
      </form>

      <form id="registerForm" style="display:none">
        <div class="field">
          <label>Họ và tên</label>
          <input type="text" id="regFullname" autocomplete="name" placeholder="VD: Nguyễn Văn A" />
        </div>
        <div class="field">
          <label>Tên đăng nhập *</label>
          <input type="text" id="regUsername" autocomplete="username" required />
        </div>
        <div class="field">
          <label>Email *</label>
          <input type="email" id="regEmail" autocomplete="email" required />
          <div class="hint">Thông tin đăng ký sẽ được gửi thông báo cho quản trị viên.</div>
        </div>
        <div class="field">
          <label>Mật khẩu *</label>
          <input type="password" id="regPassword" autocomplete="new-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Tạo tài khoản</button>
      </form>
    </div>
  </div>`;
}

function switchTab(tab) {
  document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
  document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
  hideMsg();
}

function showMsg(text, type) {
  const el = document.getElementById('formMsg');
  el.textContent = text;
  el.className = 'form-msg show ' + type;
}
function hideMsg() {
  const el = document.getElementById('formMsg');
  if (el) el.className = 'form-msg';
}

function bindAuthEvents() {
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const username = document.getElementById('loginUsername').value;
    const password = document.getElementById('loginPassword').value;
    const res = loginUser({ username, password });
    if (!res.ok) { showMsg(res.error, 'error'); return; }
    renderApp();
  });

  document.getElementById('registerForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const fullname = document.getElementById('regFullname').value;
    const username = document.getElementById('regUsername').value;
    const email = document.getElementById('regEmail').value;
    const password = document.getElementById('regPassword').value;
    const res = registerUser({ username, email, fullname, password });
    if (!res.ok) { showMsg(res.error, 'error'); return; }
    showMsg('Tạo tài khoản thành công! Đang vào trang ôn tập...', 'ok');
    setTimeout(renderApp, 600);
  });
}

renderApp();
</script>
</body>
</html>
