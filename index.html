<header><h1>Ôn tập Lịch sử 12 – Giữa kì I (2026–2027)</h1><p>Trường THCS và THPT Huỳnh Văn Nghệ · Bài 1 → 6 · Bấm câu hỏi để xem đáp án, làm Đúng/Sai để chấm điểm</p></header>

<script>
const B=[
{t:"Bài 1. Liên hợp quốc",
q:[
["Câu 1. Bối cảnh thành lập LHQ, thời gian, địa điểm, thành phần, mục tiêu, nguyên tắc hoạt động.","Bối cảnh: CTTG II sắp kết thúc, các nước Đồng minh muốn có tổ chức duy trì hòa bình, an ninh sau chiến tranh; Hội nghị I-an-ta (2/1945) quyết định thành lập. Địa điểm: Hội nghị Xan Phran-xi-xcô (Mĩ), 4–6/1945, 50 nước dự, thông qua Hiến chương. Hiệu lực 24-10-1945; có 51 thành viên sáng lập; trụ sở New York. Mục tiêu và nguyên tắc: xem Câu 2."],
["Câu 2. Mục tiêu, nguyên tắc hoạt động của LHQ.","Mục tiêu: duy trì hòa bình, an ninh thế giới; phát triển quan hệ hữu nghị giữa các dân tộc trên cơ sở tôn trọng nguyên tắc bình đẳng và quyền tự quyết; thực hiện hợp tác quốc tế về kinh tế, văn hóa, xã hội, nhân đạo. Nguyên tắc: (1) bình đẳng chủ quyền và quyền tự quyết dân tộc; (2) tôn trọng toàn vẹn lãnh thổ và độc lập chính trị; (3) không can thiệp vào công việc nội bộ; (4) giải quyết tranh chấp bằng biện pháp hòa bình; (5) chung sống hòa bình và nhất trí giữa 5 nước lớn (Liên Xô, Mĩ, Anh, Pháp, Trung Quốc)."],
["Câu 3. LHQ chính thức thành lập vào thời gian nào? Có bao nhiêu nước thành viên?","Chính thức thành lập ngày 24-10-1945 với 51 nước thành viên sáng lập. Hiện nay có 193 nước thành viên."],
["Câu 4. Mục tiêu quan trọng nhất của LHQ là gì?","Duy trì hòa bình và an ninh thế giới."],
["Câu 5. Nguyên tắc nào được Việt Nam vận dụng vào giải quyết vấn đề Biển Đông?","Nguyên tắc giải quyết tranh chấp quốc tế bằng biện pháp hòa bình, không đe dọa dùng vũ lực; tôn trọng độc lập, chủ quyền, toàn vẹn lãnh thổ; dựa trên luật pháp quốc tế (Công ước LHQ về Luật Biển 1982 – UNCLOS)."],
["Câu 6. Vai trò của LHQ là","Duy trì hòa bình, an ninh quốc tế; thúc đẩy quan hệ hữu nghị, hợp tác; giải quyết xung đột, tranh chấp bằng biện pháp hòa bình; thúc đẩy phi thực dân hóa, quyền con người, phát triển bền vững; giải quyết các vấn đề toàn cầu."],
["Câu 7. Việt Nam gia nhập LHQ vào thời gian nào? Thành viên thứ…? Hiện nay LHQ có bao nhiêu nước?","Việt Nam gia nhập ngày 20-9-1977, là thành viên thứ 149. Hiện nay LHQ có 193 nước thành viên."]],
src:"“[Năm 1960], Đại hội đồng Liên hợp quốc đã thông qua bản Tuyên ngôn về thủ tiêu hoàn toàn chủ nghĩa thực dân, trao trả độc lập cho các quốc gia và dân tộc thuộc địa. Đó là một sự kiện chính trị quan trọng. Tuyên ngôn đã khẳng định các nước thực dân đã vi phạm nguyên tắc quan trọng nhất của luật pháp quốc tế; khẳng định rõ ràng cơ sở pháp lí quốc tế của cuộc đấu tranh giành độc lập của các dân tộc bị áp bức”.",
cite:"(Nguyễn Quốc Hùng – Nguyễn Hồng Quân, Liên hợp quốc và Lực lượng gìn giữ hòa bình Liên hợp quốc, NXB Chính trị quốc gia, 2008, tr.46)",
tf:[["Năm 1960, Liên hợp quốc thông qua bản Tuyên ngôn về thủ tiêu hoàn toàn chủ nghĩa thực dân.",1,"Đúng theo tư liệu."],
["Tuyên ngôn về thủ tiêu hoàn toàn chủ nghĩa thực dân (1960) đã bổ sung thêm những nguyên tắc hoạt động cơ bản của tổ chức Liên hợp quốc.",0,"Sai: Tuyên ngôn khẳng định, cụ thể hóa nguyên tắc sẵn có trong Hiến chương chứ không bổ sung nguyên tắc mới."],
["Tuyên ngôn về thủ tiêu hoàn toàn chủ nghĩa thực dân (1960) thể hiện sự ủng hộ của Liên hợp quốc đối với sự nghiệp đấu tranh giành độc lập của nhân dân các nước Á, Phi, Mĩ La-tinh.",1,"Đúng."],
["Nội dung chính của đoạn tư liệu khẳng định vai trò bảo vệ quyền con người của Liên hợp quốc.",0,"Sai: nội dung chính là vai trò thúc đẩy phi thực dân hóa, trao trả độc lập."]]},

{t:"Bài 2. Trật tự thế giới trong Chiến tranh lạnh",
q:[
["Câu 1. Bối cảnh triệu tập Hội nghị I-an-ta, địa điểm, thành phần.","Đầu 1945, CTTG II bước vào giai đoạn kết thúc, nhiều vấn đề cấp bách: nhanh chóng đánh bại phát xít, tổ chức thế giới sau chiến tranh, phân chia thành quả. Thời gian 4–11/2/1945, địa điểm I-an-ta (Liên Xô); thành phần: nguyên thủ 3 cường quốc Liên Xô (Xta-lin), Mĩ (Ru-dơ-ven), Anh (Sớc-sin)."],
["Câu 2. Những quyết định của Hội nghị I-an-ta.","(1) Tiêu diệt tận gốc phát xít Đức và chủ nghĩa quân phiệt Nhật. (2) Thành lập Liên hợp quốc. (3) Liên Xô tham chiến chống Nhật sau khi Đức đầu hàng 2–3 tháng. (4) Phân chia phạm vi ảnh hưởng: Liên Xô – Đông Âu, Đông Đức, Đông Berlin; Mĩ, Anh, Pháp – Tây Âu, Tây Đức; Đức chia 4 khu vực chiếm đóng; Mông Cổ giữ nguyên trạng; Liên Xô được Nam Xa-kha-lin, quần đảo Cu-rin; quân đội Mĩ chiếm Nhật Bản, Triều Tiên chia ở vĩ tuyến 38."],
["Câu 3. Trật tự hai cực I-an-ta là","Là hệ thống quan hệ quốc tế hình thành sau CTTG II theo các thỏa thuận I-an-ta và Pốt-xđam, thế giới chia thành hai phe – tư bản chủ nghĩa và xã hội chủ nghĩa – do hai siêu cường Mĩ và Liên Xô đứng đầu, đối đầu về chính trị, kinh tế, quân sự (Chiến tranh lạnh)."],
["Câu 4. Những quyết định của Hội nghị I-an-ta dẫn đến hệ quả gì?","Hình thành khuôn khổ trật tự thế giới mới – trật tự hai cực I-an-ta; thế giới chia thành hai phe đối lập, Mĩ và Liên Xô đối đầu (Chiến tranh lạnh); LHQ ra đời; chiến tranh cục bộ, tranh chấp ở nhiều khu vực (Triều Tiên, Việt Nam…); đồng thời hạn chế nguy cơ chiến tranh thế giới mới."],
["Câu 5. Trật tự hai cực I-an-ta bắt đầu và kết thúc khi nào? (dẫn chứng cụ thể)","Bắt đầu: 2/1945 từ Hội nghị I-an-ta (củng cố qua Chiến tranh lạnh: Học thuyết Truman 3/1947, kế hoạch Mác-san 1947, NATO 1949, SEV 1949, Vác-sa-va 1955). Kết thúc: Liên Xô tan rã 25-12-1991, Đông Âu sụp đổ (1989–1991), SEV và Vác-sa-va giải thể (1991); tháng 12/1989 hai nước Mĩ – Xô tuyên bố chấm dứt Chiến tranh lạnh (Man-ta)."],
["Câu 6 (bổ sung). Nguyên nhân sụp đổ của trật tự hai cực.","Cuộc chạy đua vũ trang làm Mĩ và Liên Xô suy giảm; Liên Xô khủng hoảng, cải tổ thất bại; Nhật, Tây Âu, Trung Quốc vươn lên; phong trào giải phóng dân tộc và xu thế hòa hoãn."]],
src:"“Bài học của thời kì Chiến tranh lạnh đã chứng tỏ phương thức quan hệ quốc tế lấy đối đầu chính trị – quân sự là chủ yếu không còn phù hợp, phải chịu nhiều tổn thất hoặc thất bại như hai nước Xô – Mỹ và một bị thương, một bị mất. Trong khi đó, phương thức lấy hợp tác và cạnh tranh về kinh tế – chính trị là chính lại thu được nhiều tiến bộ, kết quả như các nước Đức, Nhật và NICs. Sự hưng thịnh hay suy vong của một quốc gia quyết định bởi sức mạnh tổng hợp của quốc gia đó, mà chủ yếu là thực lực kinh tế và khoa học – kĩ thuật”.",
cite:"(Vũ Dương Ninh (Chủ biên), Một số chuyên đề lịch sử thế giới, NXB Đại học Quốc gia Hà Nội, 2001, tr.401)",
tf:[["Hợp tác về kinh tế – chính trị làm suy yếu tiềm lực phát triển của từng nước.",0,"Sai: tư liệu cho thấy hợp tác và cạnh tranh kinh tế là phương thức có nhiều kết quả."],
["“Một bị thương, một bị mất” trong đoạn tư liệu là sự suy yếu của hệ thống xã hội chủ nghĩa và sự tan rã của hệ thống tư bản chủ nghĩa sau Chiến tranh lạnh.",0,"Sai: “một bị thương” là Mĩ, “một bị mất” là Liên Xô (sụp đổ)."],
["Thực lực kinh tế và khoa học – kĩ thuật có vai trò quan trọng đối với sự phát triển của một quốc gia.",1,"Đúng theo câu cuối tư liệu."],
["Thực tiễn quan hệ quốc tế từ sau Chiến tranh lạnh đến nay cho thấy các nước có thể chế chính trị khác nhau đều có vai trò đối với sự hình thành Trật tự thế giới đa cực.",1,"Đúng."]]},

{t:"Bài 3. Trật tự thế giới sau Chiến tranh lạnh",
q:[
["Câu 1. Các xu thế phát triển chính của thế giới sau Chiến tranh lạnh.","Hòa bình, hợp tác và phát triển; trật tự thế giới đa cực, đa trung tâm hình thành; các quốc gia điều chỉnh chiến lược phát triển lấy kinh tế làm trọng tâm; toàn cầu hóa và cách mạng khoa học – công nghệ phát triển mạnh."],
["Câu 2. Sau Chiến tranh lạnh, xu thế nào nổi lên trong quan hệ giữa các quốc gia?","Xu thế hòa bình, hợp tác và phát triển; đối thoại, hợp tác thay cho đối đầu."],
["Câu 3. Quốc gia nào có ưu thế vượt trội về sức mạnh tổng hợp những năm đầu thập niên 1990?","Mĩ."],
["Câu 4. Lĩnh vực nào ngày càng giữ vai trò quan trọng trong quan hệ quốc tế?","Kinh tế."],
["Câu 5. Xu thế chủ đạo trong quan hệ giữa các cường quốc sau Chiến tranh lạnh là","Đối thoại, hợp tác, thỏa hiệp, vừa hợp tác vừa cạnh tranh, tránh xung đột trực tiếp."],
["Câu 6. “Chiếm 2/3 dân số, 90% GDP, 80% thương mại toàn cầu” nói đến nhóm nước nào?","Nhóm G20 (các nền kinh tế lớn nhất thế giới)."],
["Câu 7. Quan hệ quốc tế những năm đầu thế kỉ XXI là","Hòa bình, hợp tác, phát triển là xu thế chính; đồng thời cạnh tranh chiến lược giữa các nước lớn, xung đột cục bộ, khủng bố, tranh chấp lãnh thổ vẫn diễn ra; trật tự đa cực đang hình thành."],
["Câu 8. Vì sao các quốc gia điều chỉnh chiến lược phát triển, tập trung vào kinh tế?","Chiến tranh lạnh kết thúc, hòa bình lâu dài; kinh tế là nền tảng của sức mạnh tổng hợp; cách mạng khoa học – công nghệ, toàn cầu hóa tạo thời cơ và thách thức, các nước muốn tăng thực lực để nâng cao vị thế."]],
src:"“Trật tự thế giới mới này được hình thành như thế nào, còn tuỳ thuộc ở nhiều nhân tố: Sự phát triển về thực lực kinh tế, chính trị, quân sự của các cường quốc Mỹ, Nga, Trung Quốc, Anh, Pháp, Nhật Bản, Đức trong cuộc chạy đua về sức mạnh quốc gia tổng hợp… Sự lớn mạnh của lực lượng cách mạng thế giới (sự thành bại của công cuộc cải cách, đổi mới ở các nước xã hội chủ nghĩa…); Sự phát triển của cách mạng khoa học – kĩ thuật sẽ còn tiếp tục tạo ra những ‘đột phá’ và biến chuyển trên cục diện thế giới”.",
cite:"(Nguyễn Anh Thái (Chủ biên), Lịch sử thế giới hiện đại, NXB Giáo dục Việt Nam, 2021, tr.424)",
tf:[["Đoạn tư liệu đề cập nội dung chính là Trật tự thế giới hai cực I-an-ta.",0,"Sai: nói về sự hình thành trật tự thế giới mới (đa cực) sau Chiến tranh lạnh."],
["Anh, Pháp ngày càng trở thành những cực lớn nhất trong trật tự thế giới đa cực từ sau Chiến tranh thế giới thứ hai.",0,"Sai: Mĩ, Trung Quốc… mới là các trung tâm lớn; Anh, Pháp không phải cực lớn nhất."],
["Sự phát triển của cách mạng khoa học – kĩ thuật là một trong những nhân tố tác động đến sự hình thành trật tự thế giới mới.",1,"Đúng."],
["Sức mạnh tổng hợp của các cường quốc Mỹ, Nga, Trung Quốc, Anh, Pháp, Nhật Bản, Đức sẽ góp phần định hình trật tự thế giới mới.",1,"Đúng."]]},

{t:"Bài 4. Sự ra đời và phát triển của ASEAN",
q:[
["Câu 1. ASEAN được thành lập vào thời gian nào? Ở đâu?","Ngày 8-8-1967, tại Băng Cốc (Thái Lan)."],
["Câu 2. Những quốc gia nào là thành viên sáng lập ASEAN?","5 nước: In-đô-nê-xi-a, Ma-lai-xi-a, Phi-líp-pin, Xin-ga-po, Thái Lan."],
["Câu 3. Văn kiện nào đánh dấu sự ra đời của ASEAN?","Tuyên bố Băng Cốc (8-8-1967)."],
["Câu 4. Mục tiêu thành lập ASEAN là","Thúc đẩy hợp tác phát triển kinh tế, văn hóa, giáo dục, xã hội; duy trì hòa bình, ổn định khu vực; tăng cường tinh thần hợp tác và hiểu biết lẫn nhau."],
["Câu 5. Mục tiêu tổng quát của ASEAN là","Xây dựng Đông Nam Á hòa bình, ổn định, phát triển bền vững; tăng cường hợp tác, đoàn kết, gắn kết; nâng cao vị thế khu vực (Hiến chương ASEAN 2007)."],
["Câu 6. Việt Nam chính thức gia nhập ASEAN vào thời gian nào?","Ngày 28-7-1995, là thành viên thứ 7."],
["Câu 7. Nêu các giai đoạn phát triển của ASEAN.","(1) 1967–1976: ASEAN thành lập, hợp tác lỏng lẻo, chưa có hiệu quả. (2) 1976–1999: Hiệp ước Ba-li, mở rộng thành viên, đẩy mạnh hợp tác. (3) Từ 1999 đến nay: hoàn thành 10 nước, xây dựng và phát triển Cộng đồng ASEAN (2015)."],
["Câu 8. Thành tựu chính trị – an ninh của ASEAN giai đoạn 1976–1999?","Ký Hiệp ước thân thiện và hợp tác (Hiệp ước Ba-li, 1976); Tuyên bố Hòa hợp ASEAN; giải quyết vấn đề Campuchia; Hiệp ước Đông Nam Á không có vũ khí hạt nhân (1995); lập ARF (1994); kết nạp Việt Nam (1995), Lào, Mi-an-ma (1997), Cam-pu-chia (1999) – ASEAN gồm 10 nước."]],
src:"“Đến năm 2020, ASEAN sẽ thiết lập được một Đông Nam Á hoà bình và ổn định, ở đó mỗi nước sống bình yên, những nguyên nhân xung đột đã được loại bỏ qua việc tôn trọng công lý, luật pháp và tăng cường tinh thần tự cường quốc gia và khu vực,… toàn bộ Đông Nam Á sẽ là một Cộng đồng ASEAN nhận thức được các mối liên hệ lịch sử của mình, hiểu rõ di sản văn hoá của mình và gắn bó với nhau bằng một bản sắc chung của khu vực”.",
cite:"(Trích: Tầm nhìn ASEAN 2020)",
tf:[["Nội dung Tầm nhìn ASEAN 2020 hướng đến xây dựng một ASEAN hoà bình và ổn định.",1,"Đúng."],
["Tầm nhìn ASEAN 2020 là văn bản đầu tiên đề xuất ý tưởng xây dựng cộng đồng ASEAN.",0,"Sai theo đáp án đã ghi: ý tưởng Cộng đồng chính thức được đề cập trong Tuyên bố Ba-li II (2003)."],
["Đến năm 2007, Cộng đồng ASEAN chính thức thành lập.",0,"Sai: Cộng đồng ASEAN thành lập 31-12-2015 (2007 là năm ký Hiến chương)."],
["Tầm nhìn ASEAN 2020 hướng đến xây dựng một cộng đồng ASEAN gắn bó với nhau bằng một bản sắc chung của khu vực.",1,"Đúng."]]},

{t:"Bài 5. Cộng đồng ASEAN: từ ý tưởng đến hiện thực",
q:[
["Câu 1. Ý tưởng xây dựng Cộng đồng ASEAN khởi nguồn năm nào? Chính thức đề cập trong văn kiện nào?","Khởi nguồn từ Tầm nhìn ASEAN 2020 (1997); chính thức đề cập trong Tuyên bố Ba-li II (Hòa hợp ASEAN II, 2003)."],
["Câu 2. Cộng đồng ASEAN chính thức được thành lập vào thời gian nào?","Ngày 31-12-2015."],
["Câu 3. Mục tiêu chủ yếu của việc xây dựng Cộng đồng ASEAN là gì?","Tăng cường gắn kết, hợp tác; bảo đảm hòa bình, ổn định lâu dài; cùng thịnh vượng; nâng cao vị thế, vai trò của ASEAN."],
["Câu 4. Cộng đồng ASEAN xây dựng dựa trên những trụ cột nào?","3 trụ cột: Cộng đồng Chính trị – An ninh (APSC), Cộng đồng Kinh tế (AEC), Cộng đồng Văn hóa – Xã hội (ASCC)."],
["Câu 5. Nội dung chính của Cộng đồng Chính trị – An ninh ASEAN?","Duy trì hòa bình, an ninh, ổn định khu vực; giải quyết tranh chấp bằng biện pháp hòa bình; tăng cường hợp tác an ninh, chống khủng bố, tội phạm xuyên quốc gia; xây dựng khu vực dựa trên luật lệ."],
["Câu 6. Nội dung chính của Cộng đồng Kinh tế ASEAN?","Xây dựng thị trường và cơ sở sản xuất thống nhất; tự do lưu chuyển hàng hóa, dịch vụ, đầu tư, vốn, lao động có tay nghề; thu hẹp khoảng cách phát triển; hội nhập kinh tế toàn cầu."],
["Câu 7. Nội dung chính của Cộng đồng Văn hóa – Xã hội ASEAN?","Xây dựng cộng đồng đùm bọc, chia sẻ; nâng cao đời sống, giáo dục, y tế, bảo vệ môi trường; bảo tồn bản sắc văn hóa; xây dựng bản sắc chung ASEAN."],
["Câu 8. Thách thức và triển vọng của Cộng đồng AS
