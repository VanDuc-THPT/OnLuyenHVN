<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ôn tập 12 — Trắc nghiệm Lịch sử & Tin học</title>
<meta name="description" content="Ôn tập 12: luyện trắc nghiệm Lịch sử 12 và Tin học 12 theo từng bài/chuyên đề, chấm điểm tức thì, theo dõi tiến độ." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.3.3/dist/email.min.js"></script>
</head>
<body>

<header class="topbar">
  <div class="container row">
    <div class="brand"><span class="star">★</span> <div>Ôn tập 12<small>Lịch sử · Tin học — Ôn tập toàn diện</small></div></div>
    <div style="display:flex;align-items:center;gap:10px">
      <button id="themeToggleBtn" class="theme-toggle" onclick="toggleTheme()" title="Chuyển giao diện sáng/tối">🌙</button>
      <div id="headerRight"></div>
    </div>
  </div>
</header>

<main>
  <div class="container" id="appRoot"></div>
</main>

<footer>Ôn tập 12 · Lịch sử & Tin học · Chạy hoàn toàn trên trình duyệt (GitHub Pages)</footer>

<script src="js/data.js"></script>
<script src="js/data_tinhoc.js"></script>
<script src="js/auth.js"></script>
<script>
function renderApp() {
  const root = document.getElementById('appRoot');
  const user = currentUser();
  renderHeaderRight();

  if (!user) {
    root.innerHTML = renderAuthScreen();
    bindAuthEvents();
    return;
  }

  const lsTotal = QUIZ_DATA_LICHSU.reduce((s, l) => s + l.questions.length, 0);
  const thTotal = QUIZ_DATA_TINHOC.reduce((s, l) => s + l.questions.length, 0);
  const lsStats = subjectStats(user, 'lichsu', QUIZ_DATA_LICHSU.length);
  const thStats = subjectStats(user, 'tinhoc', QUIZ_DATA_TINHOC.length);

  root.innerHTML = `
    <div class="hub-hero">
      <div class="hub-badge">🎓 Nền tảng ôn tập cuối kỳ · Khối 12</div>
      <h1>Chào ${user.fullname || user.username} 👋</h1>
      <p>Chọn môn học bạn muốn ôn tập hôm nay. Mỗi môn có bộ câu hỏi bám sát đề cương, chấm điểm tức thì và lưu lại tiến độ riêng cho bạn.</p>
    </div>

    <div class="subject-grid">
      <a class="subject-card lichsu" href="lichsu.html">
        <span class="icon">📜</span>
        <h3>Ôn tập Lịch sử 12</h3>
        <p>Bài 1–17 · Từ trật tự thế giới sau Chiến tranh lạnh đến tư tưởng Hồ Chí Minh.</p>
        <div class="subject-meta">
          <span>📚 ${QUIZ_DATA_LICHSU.length} bài học</span>
          <span>❓ ${lsTotal} câu hỏi</span>
        </div>
        <div class="subject-progress">
          <div class="progress-bar"><i style="width:${lsStats.avgPct}%"></i></div>
          <div class="subject-meta" style="margin-top:6px"><span>${lsStats.done}/${lsStats.lessonCount} bài đã luyện</span><span>${lsStats.avgPct}% điểm TB</span></div>
        </div>
        <span class="cta">Vào ôn tập →</span>
      </a>

      <a class="subject-card tinhoc" href="tinhoc.html">
        <span class="icon">💻</span>
        <h3>Ôn tập Tin học 12</h3>
        <p>AI · Mạng máy tính · Đạo đức số · Thiết kế trang web HTML.</p>
        <div class="subject-meta">
          <span>📚 ${QUIZ_DATA_TINHOC.length} chuyên đề</span>
          <span>❓ ${thTotal} câu hỏi</span>
        </div>
        <div class="subject-progress">
          <div class="progress-bar"><i style="width:${thStats.avgPct}%"></i></div>
          <div class="subject-meta" style="margin-top:6px"><span>${thStats.done}/${thStats.lessonCount} chuyên đề đã luyện</span><span>${thStats.avgPct}% điểm TB</span></div>
        </div>
        <span class="cta">Vào ôn tập →</span>
      </a>
    </div>

    <div style="margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <a class="btn btn-ghost" href="profile.html">🪪 Hồ sơ của tôi</a>
    </div>
  `;
}

function renderAuthScreen() {
  const lsTotal = QUIZ_DATA_LICHSU.reduce((s, l) => s + l.questions.length, 0);
  const thTotal = QUIZ_DATA_TINHOC.reduce((s, l) => s + l.questions.length, 0);
  return `
  <div class="auth-wrap">
    <div class="auth-split">

      <div class="auth-side">
        <div class="auth-side-inner">
          <div class="star">★</div>
          <h1>Ôn tập 12</h1>
          <p>Một tài khoản — ôn luyện cả Lịch sử và Tin học, bám sát đề cương, dễ nhớ, dễ ôn trước kỳ thi.</p>
          <ul class="auth-perks">
            <li>📜 <b>Lịch sử 12</b> — ${QUIZ_DATA_LICHSU.length} bài · ${lsTotal} câu hỏi</li>
            <li>💻 <b>Tin học 12</b> — ${QUIZ_DATA_TINHOC.length} chuyên đề · ${thTotal} câu hỏi</li>
            <li>🎯 Ôn theo từng bài, ôn tổng hợp hoặc trộn ngẫu nhiên</li>
            <li>📊 Lưu điểm, theo dõi tiến bộ riêng cho từng môn</li>
            <li>🪪 Hồ sơ cá nhân: ảnh đại diện, tiểu sử, mục tiêu học tập</li>
          </ul>
        </div>
      </div>

      <div class="auth-form-wrap">
        <div class="card auth-card">
          <div class="auth-tabs">
            <button id="tabLogin" class="active" onclick="switchTab('login')">Đăng nhập</button>
            <button id="tabRegister" onclick="switchTab('register')">Đăng ký</button>
          </div>

          <div id="formMsg" class="form-msg"></div>

          <form id="loginForm">
            <div class="field">
              <label>Tên đăng nhập</label>
              <input type="text" id="loginUsername" autocomplete="username" placeholder="Nhập tên đăng nhập" required />
            </div>
            <div class="field">
              <label>Mật khẩu</label>
              <div class="pw-wrap">
                <input type="password" id="loginPassword" autocomplete="current-password" placeholder="Nhập mật khẩu" required />
                <button type="button" class="pw-toggle" onclick="togglePw('loginPassword', this)">👁</button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Đăng nhập</button>
            <p style="text-align:center;font-size:.85rem;margin-top:14px">
              <a href="#" onclick="switchTab('forgot');return false;" style="color:var(--red);font-weight:700;text-decoration:none">Quên mật khẩu?</a>
            </p>
          </form>

          <form id="forgotForm" style="display:none">
            <div class="field">
              <label>Tên đăng nhập hoặc Email đã đăng ký</label>
              <input type="text" id="forgotUser" placeholder="Nhập tên đăng nhập hoặc email" required />
              <div class="hint">Mã xác thực sẽ được gửi tới email bạn đã đăng ký trên trình duyệt này.</div>
            </div>
            <button type="button" id="sendCodeBtn" class="btn btn-primary btn-block" onclick="handleSendCode()">Gửi mã xác thực</button>

            <div id="forgotStep2" style="display:none;margin-top:16px">
              <div class="field">
                <label>Mã xác thực (6 số)</label>
                <input type="text" id="forgotCode" maxlength="6" inputmode="numeric" placeholder="VD: 123456" />
              </div>
              <div class="field">
                <label>Mật khẩu mới</label>
                <div class="pw-wrap">
                  <input type="password" id="forgotNewPw" placeholder="Ít nhất 4 ký tự" />
                  <button type="button" class="pw-toggle" onclick="togglePw('forgotNewPw', this)">👁</button>
                </div>
              </div>
              <button type="button" class="btn btn-primary btn-block" onclick="handleResetPassword()">Đặt lại mật khẩu</button>
            </div>

            <p style="text-align:center;font-size:.85rem;margin-top:14px">
              <a href="#" onclick="switchTab('login');return false;" style="color:var(--muted);text-decoration:none">← Quay lại đăng nhập</a>
            </p>
          </form>

          <form id="registerForm" style="display:none">
            <div class="field">
              <label>Họ và tên</label>
              <input type="text" id="regFullname" autocomplete="name" placeholder="VD: Nguyễn Văn A" />
            </div>
            <div class="field">
              <label>Tên đăng nhập *</label>
              <input type="text" id="regUsername" autocomplete="username" placeholder="VD: nguyenvana" required />
            </div>
            <div class="field">
              <label>Email *</label>
              <input type="email" id="regEmail" autocomplete="email" placeholder="ban@gmail.com" required />
            </div>
            <div class="field">
              <label>Mật khẩu *</label>
              <div class="pw-wrap">
                <input type="password" id="regPassword" autocomplete="new-password" placeholder="Ít nhất 4 ký tự" required />
                <button type="button" class="pw-toggle" onclick="togglePw('regPassword', this)">👁</button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Tạo tài khoản</button>
            <p class="auth-terms">Bằng việc đăng ký, bạn đồng ý lưu thông tin tài khoản trên trình duyệt này để sử dụng trang web.</p>
          </form>
        </div>
      </div>

    </div>
  </div>`;
}

function togglePw(id, btn) {
  const input = document.getElementById(id);
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.classList.toggle('active', show);
}

function switchTab(tab) {
  document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
  document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
  document.querySelector('.auth-tabs').style.display = tab === 'forgot' ? 'none' : 'flex';
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('forgotForm').style.display = tab === 'forgot' ? 'block' : 'none';
  if (tab === 'forgot') {
    document.getElementById('forgotStep2').style.display = 'none';
    document.getElementById('sendCodeBtn').textContent = 'Gửi mã xác thực';
    const f = document.getElementById('forgotForm');
    f.reset && f.reset();
  }
  hideMsg();
}

function handleSendCode() {
  const val = document.getElementById('forgotUser').value;
  if (!val.trim()) { showMsg('Vui lòng nhập tên đăng nhập hoặc email.', 'error'); return; }
  const btn = document.getElementById('sendCodeBtn');
  btn.disabled = true;
  btn.textContent = 'Đang gửi...';
  requestPasswordReset(val).then(res => {
    btn.disabled = false;
    if (!res.ok) { btn.textContent = 'Gửi mã xác thực'; showMsg(res.error, 'error'); return; }
    document.getElementById('forgotStep2').style.display = 'block';
    btn.textContent = 'Gửi lại mã';
    if (res.emailFailed) {
      showMsg('Mã đã được tạo nhưng chưa gửi được email (EmailJS mục OTP chưa cấu hình). Liên hệ quản trị viên để được cấp mã.', 'error');
    } else {
      showMsg(`Đã gửi mã xác thực tới ${res.email}. Mã có hiệu lực trong 10 phút.`, 'ok');
    }
  });
}

function handleResetPassword() {
  const val = document.getElementById('forgotUser').value;
  const code = document.getElementById('forgotCode').value;
  const newPw = document.getElementById('forgotNewPw').value;
  const res = resetPasswordWithCode(val, code, newPw);
  if (!res.ok) { showMsg(res.error, 'error'); return; }
  showMsg('Đặt lại mật khẩu thành công! Đang quay về đăng nhập...', 'ok');
  setTimeout(() => switchTab('login'), 1200);
}

function showMsg(text, type) {
  const el = document.getElementById('formMsg');
  el.textContent = text;
  el.className = 'form-msg show ' + type;
}
function hideMsg() {
  const el = document.getElementById('formMsg');
  if (el) el.className = 'form-msg';
}

function bindAuthEvents() {
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const username = document.getElementById('loginUsername').value;
    const password = document.getElementById('loginPassword').value;
    const res = loginUser({ username, password });
    if (!res.ok) { showMsg(res.error, 'error'); return; }
    renderApp();
  });

  document.getElementById('registerForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const fullname = document.getElementById('regFullname').value;
    const username = document.getElementById('regUsername').value;
    const email = document.getElementById('regEmail').value;
    const password = document.getElementById('regPassword').value;
    const res = registerUser({ username, email, fullname, password });
    if (!res.ok) { showMsg(res.error, 'error'); return; }
    showMsg('Tạo tài khoản thành công! Đang vào trang ôn tập...', 'ok');
    setTimeout(renderApp, 600);
  });
}

renderApp();
</script>
</body>
</html>
